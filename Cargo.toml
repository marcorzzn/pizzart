# pizzart — editor grafico professionale
# Workspace a dipendenze minime: il core deve compilare e testare senza rete.
[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/draw", "crates/text", "crates/io", "crates/project", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "thin"
