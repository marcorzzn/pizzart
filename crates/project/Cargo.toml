[package]
name = "pizzart-project"
description = "Salvataggio e caricamento di un progetto: zip con manifest JSON e asset binari."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pizzart-core = { path = "../core" }
pizzart-text = { path = "../text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false }
zstd = "0.13"

[dev-dependencies]
pizzart-render = { path = "../render" }
